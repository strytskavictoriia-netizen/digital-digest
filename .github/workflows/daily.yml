name: Щоденний дайджест

on:
  schedule:
    # GitHub запускає розклад із запізненням (інколи губить запуски), а час у нього в UTC.
    # Тому три запуски: публікує перший, що припаде на 08:00+ за Києвом (основний запуск — cron-job.org о 08:50), решта — пропускають.
    # Хвилина :17 — щоб не потрапити в пікове навантаження GitHub на початку години.
    - cron: "57 5 * * *"   # 08:57 Київ влітку / 07:57 взимку (пропуститься)
    - cron: "57 6 * * *"   # запасний: 09:57 влітку / 08:57 взимку
    - cron: "57 7 * * *"   # запасний
  workflow_dispatch:       # кнопка "Run workflow" для ручного запуску
    inputs:
      force:
        description: "Опублікувати повторно, навіть якщо сьогоднішній випуск уже був"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: npm install -g @anthropic-ai/claude-code

      - name: Зібрати та опублікувати дайджест
        run: python -m digest daily ${{ inputs.force && '--force' || '' }}
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}   # backend: subscription
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}               # backend: api
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAPH_TOKEN: ${{ secrets.TELEGRAPH_TOKEN }}
          HUB_BOT_TOKEN: ${{ secrets.HUB_BOT_TOKEN }}
          HUB_CHAT_ID: ${{ secrets.HUB_CHAT_ID }}
          HEALTHCHECK_URL: ${{ secrets.HEALTHCHECK_URL }}
          MIN_KYIV_HOUR: ${{ github.event_name == 'schedule' && '8' || '' }}

      - name: Зберегти архів
        run: |
          git config user.name "ai-digest-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add archive state
          git diff --cached --quiet || (git commit -m "Дайджест $(TZ=Europe/Kyiv date +%F)" && git push)

      # Якщо впало ще до Python (напр. не встановились залежності) — сповіщення все одно прийде.
      - name: Сповістити про збій
        if: failure()
        env:
          HUB_BOT_TOKEN: ${{ secrets.HUB_BOT_TOKEN }}
          HUB_CHAT_ID: ${{ secrets.HUB_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          [ -f out/notified ] && exit 0
          [ -z "$HUB_BOT_TOKEN" ] && exit 0
          curl -s "https://api.telegram.org/bot${HUB_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${HUB_CHAT_ID}" \
            --data-urlencode "parse_mode=HTML" \
            --data-urlencode "text=🗞 <b>${{ github.repository }}</b>
          ❌ Запуск дайджесту впав з технічною помилкою." \
            --data-urlencode "reply_markup={\"inline_keyboard\":[[{\"text\":\"📄 Журнал запуску\",\"url\":\"${RUN_URL}\"}]]}" > /dev/null
