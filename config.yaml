# ─────────────────────────────────────────────────────────────
#  Налаштування дайджесту. Заповнює скіл digest-builder,
#  міняти можна й вручну — наступний запуск підхопить зміни.
#  Редагувати можна прямо на GitHub (✏️ → Commit changes).
# ─────────────────────────────────────────────────────────────

title: "Дайджест"          # назва в шапці випуску, у сповіщеннях і на сторінках Telegraph
emoji: "🗞"
language: українська       # мова випуску

# Як звертатися до Claude:
#   subscription — через підписку Claude Pro/Max (секрет CLAUDE_CODE_OAUTH_TOKEN)
#   api          — через Claude API з окремим балансом (секрет ANTHROPIC_API_KEY)
backend: subscription
model: claude-sonnet-5     # claude-sonnet-5 — економно; claude-opus-5 — якісніше, але з'їдає ліміти швидше
effort: high               # low | medium | high

format:
  # layout: items — у пості всі новини рядками-посиланнями, кожна на свою сторінку Telegraph;
  #         issue — у пості топ новини з «Для нас» + посилання на ОДНУ повну сторінку випуску
  layout: items
  max_items: 12            # максимум новин у випуску (для items усе має влізти в одне повідомлення — до ~14)
  top_count: 3             # скільки головних новин детально в пості (лише для layout: issue)
  item_pages: true         # для layout: items — окрема сторінка Telegraph на кожну новину
  idea_of_day: true        # блок «💡 Ідея дня»
  tests: false             # блок «🧪 Що протестувати» — 2–4 гіпотези з випуску
  rejected_footer: false   # на сторінці випуску — «що перевірили й відкинули і чому»
  weekly: true             # тижневий підсумок (день і час — у .github/workflows/weekly.yml)

# Необов'язково: файл зі сталими фактами (ставки, умови, політики), який модель читає перед кожним
# випуском — щоб не подавати відоме як новину, а зміну помічати. Напр.: reference: reference.md
# reference: reference.md

lookback_hours: 30         # за який період збирати матеріали
avoid_repeats_days: 3      # скільки попередніх випусків показувати моделі, щоб не повторюватись

# Про що дайджест: що включати і що відкидати.
topic: |
  (опис теми)

# Хто читає і чим займається — від цього залежать рекомендації «як використати».
audience: |
  (опис читачів)

# Напрями (рубрики) випуску. Порядок тут = порядок у випуску.
rubrics:
  - id: main
    emoji: "📌"
    title: Головне
    hint: усе важливе з теми

# ─────────────────────────────────────────────────────────────
#  Джерела. Додавати найпростіше командою:
#    python -m digest add-source <посилання>
#  (сайт, t.me/канал, youtube.com/@канал, reddit.com/r/спільнота або RSS) —
#  вона сама визначить тип, перевірить джерело й допише його сюди.
#  Типи: rss | telegram | hackernews. Опції: tier (T1–T4, UA — рівень довіри), limit, keywords, undated, delay.
#  ⚠️ Список sources має лишатися останнім у файлі.
# ─────────────────────────────────────────────────────────────
sources:
