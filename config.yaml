# ─────────────────────────────────────────────────────────────
#  Налаштування дайджесту. Заповнює скіл digest-builder,
#  міняти можна й вручну — наступний запуск підхопить зміни.
#  Редагувати можна прямо на GitHub (✏️ → Commit changes).
# ─────────────────────────────────────────────────────────────

title: "Digital Digest"    # назва в шапці випуску, у сповіщеннях і на сторінках Telegraph
emoji: "📡"
language: українська       # мова випуску

# Як звертатися до Claude:
#   subscription — через підписку Claude Pro/Max (секрет CLAUDE_CODE_OAUTH_TOKEN)
#   api          — через Claude API з окремим балансом (секрет ANTHROPIC_API_KEY)
backend: subscription
model: claude-sonnet-5     # claude-sonnet-5 — економно; claude-opus-5 — якісніше, але з'їдає ліміти швидше
effort: high               # low | medium | high

format:
  # layout: items — у пості всі новини рядками-посиланнями, кожна на свою сторінку Telegraph;
  #         issue — у пості топ новини з «Для нас» + посилання на ОДНУ повну сторінку випуску
  layout: issue
  max_items: 8             # секції не обов'язкові — краще 2 сильні новини, ніж 8 слабких
  top_count: 3             # «Головне» — 2–3 картки з «Для нас» у пості
  item_pages: false
  idea_of_day: false
  tests: true              # «🧪 Що протестувати» — 2–4 гіпотези з цього випуску
  rejected_footer: true    # «що перевірили й відкинули і чому» на повній сторінці
  weekly: true

# Довідник сталих ставок і механіки (з посібника, розділ 12). Те, що в ньому, — не новина;
# зміна чогось із нього — новина. Оновлювати, коли щось змінюється.
reference: reference.md

# Перевірка кожної новини пошуком в інтернеті перед публікацією: дата першого оголошення
# (стара новина не пройде), офіційне джерело, цифри.
verify:
  web: true
  max_candidates: 12
  max_searches: 24
  # model: claude-opus-5   # якщо Sonnet не тягне суворі правила — увімкнути (з'їдає більше ліміту)

lookback_hours: 30         # за який період збирати матеріали
avoid_repeats_days: 7      # антиповтор за сюжетом — дивимось тиждень назад

# Про що дайджест: що включати і що відкидати (посібник, розділи 3–6).
topic: |
  Щоденний галузевий дайджест про те, куди подіти готовий відеоконтент і де на ньому заробити.
  Цінність визначає не масштаб новини, а те, чи можна з неї щось зробити. Шукаємо механіку і цифри,
  а не події.

  ТРИ ФІЛЬТРИ — новина має пройти всі:
  1. «Що конкретно digital-відділ може зробити з цим протягом 90 днів?» Прийнятні відповіді: подати
     заявку · порахувати економіку · протестувати формат · змінити налаштування монетизації · внести
     в план переговорів із конкретним покупцем · перепакувати тайтл · змінити ціну · не повторити
     чужу помилку. «Нічого, просто знати» — не йде у випуск.
  2. «Що саме змінилось або вийшло за це вікно?» Корисне, але стале — це довідка, не новина.
  3. «Чи писали ми вже про цю історію?» Антиповтор за сюжетом. Один сюжет = максимум один раз у
     головному; повертатись лише коли змінився наслідок для нас.

  ЩО ПОЛЮВАТИ (у порядку користі): фактичні ставки й механіка виплат (RPM/CPM по нішах і
  географіях, revenue share, пороги входу, формули); канали доходу для свого контенту (MSN,
  відео-подкасти Spotify, FAST/AVOD, rate cards, ліцензування бібліотеки, зокрема для навчання AI);
  фінансування з відкритим дедлайном (обов'язково: дедлайн, сума, хто може подати, посилання);
  breakout-механіка (чому прострілило: формат, хук, структура, частота, цифри, відтворюваність);
  формати — хто купив, на які території, на яких умовах, digital-продовження; вертикальні
  мікродрами — unit economics; правила платформ (монетизація, AI-маркування, reuse/compilation).

  ЧОРНИЙ СПИСОК — не включаємо за замовчуванням:
  - процесуальні кроки в чужих M&A (слухання, consent decree, «очікуване закриття», призначення
    топменеджерів) — виняток: угода закрилась і є конкретний наслідок для ринку контенту;
  - квартальні звіти платформ (виручка, підписники, MAU) — виняток: цифра прямо змінює виплати
    партнерам або ціну контенту;
  - renewal і cancellation американських шоу;
  - анонси конференцій без дедлайну подачі чи застосовної механіки;
  - «X запустив FAST-канал» без умов угоди чи економіки;
  - «ринок виросте до $N млрд» без unit economics;
  - vendor- і SEO-контент як єдине джерело цифр (можна згадати з явною позначкою, не як факт);
  - чужі запуски, франшизи й угоди (FAST-канал іншої студії на іншій платформі, перенесення чужого
    шоу на стрімінг, фінал чужого формату), якщо з них не випливає ставка, умова чи механіка, яку
    ми можемо застосувати до свого контенту. Приклад, що НЕ йде: «12-річний YouTube-формат Chicken
    Shop Date виходить паралельно на Netflix» — чужий формат, жодної умови чи ставки для нас;
  - локальні історії інших країн (держпрограми, регіональні запуски, місцеві ринки) без прямого
    наслідку для України чи наших напрямків;
  - стара новина в новій статті: якщо подію оголошено раніше (тиждень, місяць тому) — це не новина.

  «ДЛЯ НАС» має називати конкретну дію з переліку фільтра 1 (подати заявку, порахувати економіку,
  протестувати формат, змінити налаштування монетизації, внести в переговори з конкретним покупцем,
  перепакувати тайтл, змінити ціну, не повторити чужу помилку). Якщо виходить лише «сигнал»,
  «приклад», «варто враховувати», «підтверджує тренд» — новина не йде у випуск.
  Виняток — зміни, що лише формуються й можуть змінити наші умови (стандарт ліцензування контенту
  для AI, законопроєкт, тест нових правил платформи): вони йдуть у «📡 На радарі», лише на сторінку.

  ВАЖЛИВО: OTT-платформи (Megogo, Sweet.tv, Київстар ТБ) — це канал продажу, один із напрямків,
  а не інфраструктура компанії. Новина про них — це ринкова розвідка про потенційного покупця,
  а не загроза власному бізнесу.

  Дату перевіряй за самим матеріалом, а не за словами «this week» у заголовку.

# Хто читає і чим займається (посібник, розділи 1–2).
audience: |
  Digital-відділ української медіагрупи Starlight Media — люди, які щодня вирішують, куди подіти
  контент і де на ньому заробити. П'ять напрямків, у порядку ваги:
  1. TV-бібліотека — головний актив: де перепродати й переупакувати готовий контент (FAST, AVOD,
     вертикалки, ліцензування, автодубляж).
  2. Продакшен великих шоу: як такі формати живуть у digital по світу, які digital-extensions дають
     гроші й аудиторію.
  3. YouTube-напрямок, що тестує американські ніші: фактичні RPM по нішах, breakout-механіка,
     формати з високим доходом, правила монетизації.
  4. Продажі контенту в OTT: хто купує, які пакети в тренді, ціни за годину, умови угод.
  5. Вертикальні мікродрами — розвідка: собівартість епізоду, моделі виплат, хто заходить і на
     яких умовах.
  «Для нас» — один-два речення практичного наслідку для одного з цих напрямків.

# Секції випуску (посібник, розділ 9). Порожню секцію не пишемо.
rubrics:
  - id: money
    emoji: "💵"
    title: Гроші й ставки
    hint: числа, виплати, умови — RPM/CPM по нішах і географіях, revenue share, пороги входу, формули виплат; лише з джерелом
  - id: channels
    emoji: "📺"
    title: Канали доходу
    hint: MSN і Microsoft Start, відео-подкасти Spotify, FAST-агрегатори, AVOD/SVOD rate cards, ліцензування бібліотеки (зокрема для AI), монетизація бібліотеки на YouTube
  - id: funding
    emoji: "🎟"
    title: Фінансування і гранти
    hint: лише з відкритим дедлайном — обов'язково дедлайн, сума, хто може подати, посилання; без дедлайну не включати
  - id: breakout
    emoji: "🚀"
    title: "Розбір: що прострілило і чому"
    hint: механіка, не чарт — формат, хук, структура, частота, цифри і чи це відтворювано
  - id: formats
    emoji: "🎭"
    title: Формати
    hint: хто купив який формат, на які території, за яких умов; digital-продовження великих шоу
  - id: vertical
    emoji: "📱"
    title: Вертикалки
    hint: unit economics мікродрам — вартість епізоду й сезону, ліцензії, revenue share платформ, хто заходить і на яких умовах, провали і їх причини
  - id: rules
    emoji: "📜"
    title: Правила платформ
    hint: що тепер можна й не можна монетизувати, вимоги до AI-контенту й маркування, політики reuse/compilation/inauthentic content — критично для репурпоузу бібліотеки

